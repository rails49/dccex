# What serves the built page. One root, one document, and no proxying: the
# face the page talks to is reached through the door on the same origin under
# a prefix the door strips (ADR-0004 d.2), so it never comes past here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `vite` names a built asset after the hash of what is in it, so a name
    # that resolves resolves to the same bytes forever and one that does not is
    # a miss rather than a stale document.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # One page. Anything else is that page, so a reload on a path the page put
    # in the bar is the page again and not a 404 from the server under it.
    #
    # Never cached: it is the one document that names which build of the assets
    # to fetch, and a browser holding an old copy of it would ask for files a
    # deploy has taken away.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
