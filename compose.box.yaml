# The box's half of this project: the mirror, the shared network the door is
# on, and the box's own declaration required rather than defaulted.
#
#   docker compose -f compose.yaml -f compose.box.yaml \
#     --env-file /etc/rails49/box.env --env-file .env up -d --build
#
# which is what `scripts/deploy.sh` runs, and what ADR-0005 d.7's rollback runs
# without the `--build`.
#
# **Why there are two files and not one.** `compose.yaml` has one thing it has
# to do: come up from a clean clone with no box behind it (ADR-0008). That is
# why the shared network is not declared external there and why `BOX_DOMAIN`
# has a default — a project that declared a network the installation creates
# would refuse to start on a laptop, and a laptop is where the page is worked
# on. A box wants the opposite of both, and wants a device only a box has. So
# the box's requirements are an overlay rather than a second project: the name
# is still `compose.yaml`'s `name: dccex`, and every command above resolves to
# the one project (ADR-0005 d.7's `.env` is that project's).

# Nothing reads this. It is **the box guard**: where the box's name is
# required, so that a box started without its declaration is told which file
# is missing rather than given routers under a blank name. Compose interpolates
# the whole file before it runs any subcommand, so this one line covers every
# rule below and every `logs` and `ps` besides — the shape `control` uses for
# the same job. It lived inside the page's host rule until #40, which put it at
# the mercy of whoever next rewrote that label; here it belongs to no label.
x-require-box-domain: ${BOX_DOMAIN:?the box's declaration is missing or declares no BOX_DOMAIN - this stack is started against /etc/rails49/box.env, which is root-owned and edited by hand, and there is no default for it on a box}

services:
  # The page, on a box. Everything about it is `compose.yaml`'s but the network
  # it is reached on and the domain it is reached at.
  web:
    networks:
      # The project's own, which is where `compose.yaml` puts it and where it
      # would be with nothing said here. Named because naming a second one
      # replaces the list rather than adding to it.
      - default
      # The installation's, created by it under a fixed name and declared
      # external below. The door is on it and this is how it dials the page —
      # `traefik.docker.network` on the label has named it since the label was
      # written, and joining it is what this file adds.
      - rails49
    labels:
      # The one label a box moves: the host rule carries the box's own domain
      # rather than the clean clone's `localhost`. Every other label is
      # `compose.yaml`'s and is merged in as written. No `:?` here — the guard
      # at the top of this file has already refused a box with no domain.
      - traefik.http.routers.dccex-ui.rule=Host(`dccex.${BOX_DOMAIN}`)

  # The mirror: the app that holds the command station's device and repeats it
  # on 2560. This is the service `control` deleted with its own copy of the
  # app (control#567), recreated here — without the broker, which went with
  # the bus (ADR-0001), and without a profile, because this project is the
  # mirror rather than a profile of a bigger one.
  mirror:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # The commit, to the build and not only to the name: the image carries
        # it as `org.opencontainers.image.revision`, so a `docker inspect` on
        # the box answers what a container was built from even for an image
        # somebody renamed (ADR-0005 d.4). The same variable the name below is
        # built from, so the two can never disagree — with no fallback here,
        # because `dev` belongs in the name and a revision that reads like a
        # commit and is not one is worse than an empty one (#97,
        # `deploy/Dockerfile`, and the page's since #57).
        DCCEX_COMMIT: ${DCCEX_COMMIT:-}
    # Named by the commit it was built from, and the name never moves
    # (ADR-0005 d.1). One variable names both this image and the page's,
    # because the two are two images of one commit and the commit is the one
    # thing that differs between two deploys of this repository — so going
    # back is the one line d.7 asks for, in this project's `.env`.
    image: dccex:${DCCEX_COMMIT:-dev}
    restart: unless-stopped
    # 2560 on the LAN, raw. It is what it has always been: JMRI, a hand-held
    # throttle and the translator are programs on the wifi holding a serial
    # conversation, what limits them is the network they are on, and there is
    # no other way in for DecoderPro (control ADR-0042, ADR-0004 d.5).
    #
    # **The face's port is published by nothing.** It answers on 8080 inside
    # the container and reaches a browser through the door or not at all
    # (ADR-0004 d.1): one of the three things it does is write firmware onto
    # the command station, and that does not go on an unauthenticated network
    # because the port beside it does.
    ports:
      - "2560:2560"
    # The device, which is a mapping this project has to carry because there
    # is no udev rule anywhere: `/dev/dccex` was the container-side name of
    # `control`'s own `devices:` entry and went out with it. The host side is
    # the `by-id` path, behind a variable so a box that moves it overrides one
    # line; the container side keeps the name the app's default argument and
    # this repository's prose already say.
    devices:
      - "${DCCEX_STATION_DEVICE:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}:/dev/dccex"
    # What the image's own `CMD` already is, written out because a stack that
    # does not say which device on which port is a stack somebody has to read
    # a Dockerfile to understand.
    command: ["--device", "/dev/dccex", "--port", "2560"]
    # Long enough for a flash to be waited out. `firmware.py` gives esptool
    # 300 seconds before it kills it, and a container killed in the middle of
    # a write leaves the command station half written; the app closes its face
    # first and waits the flash out after, and this is the room to do it in.
    #
    # **It is not what a stop takes.** With nothing being written this app
    # goes in about a second, and `docs/cutover.md`'s check 6 bounds it at
    # five seconds by the clock — the step that stops this container with a
    # client on 2560 that has stopped reading. Read as what a shutdown should
    # take, this number turns that check into a five-and-a-half-minute wait
    # that ends cleanly whether the app hung or not (#103). The two measure
    # different things, and the one that moves for a flash is this one.
    stop_grace_period: 330s
    # The face's route, and nothing over 2560. A browser reaches this
    # container, but only through its face, so the routers here name the
    # face's port and no other (ADR-0004 d.1, d.5, as amended by #40).
    #
    # Same host as the page, under `/dccex-usb`, at priority 2: the page's
    # router sits at 1 and keeps everything on the origin the face does not
    # claim, which is the shape `control` gave its broker's `/mqtt` beside its
    # page (ADR-0004 d.2). The prefix is stripped before the face sees a
    # request, so the face answers `/releases` and `/stream`, and the prefix
    # is spelt once more in `ui/src/face.ts`, which a test holds to this.
    #
    # The monitor's stream rides this router too, so it is `wss://` on the
    # page's own origin under the page's certificate (d.3).
    #
    # **No refusal router.** A page from another origin is refused by the face
    # itself, with a status and a sentence (`face.py`, `elsewhere`), which is
    # how `control`'s store does it; the door gets no `-foreign` twin of this
    # route (d.4). Nothing here rewrites `Host`, because that refusal compares
    # the page's origin to the host the door passes on.
    labels:
      - traefik.enable=true
      - traefik.docker.network=rails49
      - traefik.http.services.dccex-usb.loadbalancer.server.port=8080
      - traefik.http.routers.dccex-usb.rule=Host(`dccex.${BOX_DOMAIN}`) && PathPrefix(`/dccex-usb`)
      - traefik.http.routers.dccex-usb.priority=2
      - traefik.http.routers.dccex-usb.entrypoints=websecure
      - traefik.http.routers.dccex-usb.service=dccex-usb
      - traefik.http.routers.dccex-usb.middlewares=dccex-usb-strip
      - traefik.http.routers.dccex-usb.tls.certresolver=le
      - traefik.http.middlewares.dccex-usb-strip.stripprefix.prefixes=/dccex-usb
    # The project's own network and the installation's, which is the one the
    # door dials the face on. Joined for the face alone: 2560 is published to
    # the LAN and needs neither.
    networks:
      - default
      - rails49

networks:
  # The installation's, under the fixed name the door and every other stack on
  # the box know it by. External: this project joins it and does not create it,
  # and a box where the installation has not run is a box where this refuses
  # to start rather than one where the door quietly cannot see the page or the
  # face.
  rails49:
    external: true
