name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('pyproject.toml') != ''
      - run: uv sync
        if: hashFiles('pyproject.toml') != ''
      - name: gate
        run: |
          cmd=$(sed -n 's/^ci:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || cmd=$(sed -n 's/^[Gg]ate:[[:space:]]*//p' CLAUDE.md 2>/dev/null | head -1)
          [ -n "$cmd" ] || { [ -x scripts/check.sh ] && cmd=./scripts/check.sh; }
          [ -n "$cmd" ] || { grep -qE '^check:' Makefile 2>/dev/null && cmd="make check"; }
          [ -n "$cmd" ] || { echo "no ci:/gate: line in CLAUDE.md, no scripts/check.sh, no make check"; exit 1; }
          echo "+ $cmd"
          bash -c "$cmd"

  # The checks that need a Docker daemon, which the gate does not collect
  # (#54, #56). They live here so that the gate stays seconds long and
  # runnable on a machine with no daemon, while the one check that proves the
  # page is built and served still cannot go missing from a pull request
  # without turning it red. This job is required on the default branch beside
  # `ci`, and `CI` being set is what makes a missing daemon a failure inside
  # it rather than a skip.
  docker:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: the image, built and served
        run: uv run --frozen pytest -q -m docker

  # The checks that need a node, which the gate does not collect either (#101,
  # #126). Two halves, and the split is what keeps `scripts/check.sh` runnable
  # with no node at all.
  #
  # The seven modules of the page written as JavaScript are run rather than
  # read, and the runner's own node is what runs them: nothing is installed,
  # nothing is bundled and nothing is fetched. No node is set up on purpose —
  # a missing one is an assertion failure inside those tests, which is what
  # keeps a promised toolchain from turning into a skip.
  #
  # The components are mounted and read back, which a bare node cannot do: Lit
  # needs a DOM, so `vitest` and `happy-dom` are installed here from the lock
  # file the image builds with (#126). That install is why this is the job they
  # run in and not the gate — a component test that can pass while the rendered
  # page is wrong is what reading the sources was, and the price of not reading
  # them is one DOM in one job.
  #
  # This job is required on the default branch beside `ci` and `docker`.
  node:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: the page's own functions, run
        run: uv run --frozen pytest -q -m node
      # `corepack` reads `packageManager`, so the pnpm that installs here is
      # the pnpm the lock file was written by — the same line
      # `deploy/ui.Dockerfile` runs for the same reason.
      - run: corepack enable
      # Run from `ui/`: corepack reads `packageManager` from the working
      # directory, and at the root there is none, so it would fetch the newest
      # pnpm, which then refuses the pinned one.
      - name: the page's components, mounted
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm test
