[project]
name = "dccex-usb"
version = "0.1.0"
description = "The command station's serial device, mirrored on a TCP port"
requires-python = ">=3.12"
dependencies = ["esptool>=5.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "black", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dccex_usb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two prerequisites the gate does not assume, one marker each.
# `scripts/check.sh` collects neither; the workflow runs each in a job that a
# pull request requires, where a missing prerequisite is a failure and not a
# skip (#54, #56, #101). A bare `pytest` still runs everything, which is what
# a development machine that has both wants.
#
# `docker` is a daemon. `node` is a node on `PATH` and no more than that — no
# packages are installed, nothing is bundled and nothing is fetched — and what
# needs it is the seven modules of the page written as JavaScript so their real
# functions can be run rather than read (`tests/ui/test_decoder.py`).
markers = [
  "docker: needs a Docker daemon",
  "node: needs a node on the machine",
]

# The three below are `control`'s at deee7b6, unchanged. The code they read
# was written under them — fully annotated, black-formatted, four `cast(...)`
# calls in `firmware.py` that exist for strict mode alone — and a side that
# formats differently is a package that stops being diffable against the
# commit `src/SOURCE.md` names.

[tool.ruff]
src = ["src", "tests"]

[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
