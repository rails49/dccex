[project]
name = "dccex-usb"
version = "0.1.0"
description = "The command station's serial device, mirrored on a TCP port"
requires-python = ">=3.12"
dependencies = ["esptool>=5.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "black", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dccex_usb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that cannot run without a Docker daemon. `scripts/check.sh` does not
# collect these; the workflow runs them in a job of its own, required on the
# pull request, where a missing daemon is a failure (#54, #56). A bare
# `pytest` still runs everything, which is what a development machine with a
# daemon on it wants.
markers = ["docker: needs a Docker daemon"]

# The three below are `control`'s at deee7b6, unchanged. The code they read
# was written under them — fully annotated, black-formatted, four `cast(...)`
# calls in `firmware.py` that exist for strict mode alone — and a side that
# formats differently is a package that stops being diffable against the
# commit `src/SOURCE.md` names.

[tool.ruff]
src = ["src", "tests"]

[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
